[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kvitto-payments"
version = "1.0.0"
description = "API платежей онлайн-школы для тестового задания Квитто"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.147.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "SQLAlchemy==2.0.55",
    "alembic==1.20.0",
    "uvicorn==0.54.0",
    "email-validator==2.3.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = ["integration: проверки конкурентных запросов и миграций"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tmp", "output", "upload", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
