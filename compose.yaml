services:
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/payments.db}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Скопируйте .env.example в .env и задайте WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - payments_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/tariffs', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  payments_data:
